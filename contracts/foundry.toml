[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
test    = "test"
script  = "script"

# Solidity compiler settings
solc_version   = "0.8.24"
optimizer      = true
optimizer_runs = 200

# Remappings (add forge-std after: forge install foundry-rs/forge-std)
# remappings = ["forge-std/=lib/forge-std/src/"]

# Gas reporting
gas_reports = ["TRIToken", "TRIBridge"]

# Fuzz test settings
[fuzz]
runs = 1000

[invariant]
runs   = 256
depth  = 15
